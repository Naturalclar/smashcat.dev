name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同じブランチで新しい push があったら、走っている古い run は止める。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # cache: pnpm を使うため、setup-node より先に pnpm を用意する。
      # バージョンは package.json の packageManager から読まれるので指定しない。
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      # tsc -b が3つの tsconfig をすべて通るため、型チェックはこれで足りる。
      - run: pnpm build
