<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>smashcat.dev</title>
    <meta name="description" content="Naturalclar (Jesse Katsumata) のツール置き場。" />
    <link rel="canonical" href="https://smashcat.dev/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://smashcat.dev/" />
    <meta property="og:title" content="smashcat.dev" />
    <meta property="og:description" content="Naturalclar (Jesse Katsumata) のツール置き場。" />
    <style>
      :root {
        --bg: #f4f7fb;
        --fg: #1b1f24;
        --muted: #5b6673;
        --card: #ffffff;
        --border: #dfe5ec;
        --accent: #2f6feb;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --bg: #10141a;
          --fg: #e8edf4;
          --muted: #9aa7b6;
          --card: #171d25;
          --border: #262f3a;
          --accent: #6ea1ff;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue',
          'Hiragino Sans', 'Noto Sans JP', sans-serif;
        line-height: 1.7;
      }
      main {
        width: 100%;
        max-width: 34rem;
      }
      h1 {
        margin: 0 0 0.25rem;
        font-size: clamp(1.75rem, 5vw, 2.5rem);
        letter-spacing: -0.02em;
      }
      .tagline {
        margin: 0 0 2rem;
        color: var(--muted);
      }
      h2 {
        margin: 0 0 0.75rem;
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 0.75rem;
      }
      a.card {
        display: block;
        padding: 1rem 1.25rem;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        text-decoration: none;
        color: inherit;
      }
      a.card:hover,
      a.card:focus-visible {
        border-color: var(--accent);
      }
      .name {
        font-weight: 600;
        color: var(--accent);
      }
      .desc {
        margin: 0.15rem 0 0;
        font-size: 0.925rem;
        color: var(--muted);
      }
      footer {
        margin-top: 2.5rem;
        font-size: 0.875rem;
        color: var(--muted);
      }
      footer a {
        color: inherit;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>smashcat.dev</h1>
      <p class="tagline">Naturalclar (Jesse Katsumata) のツール置き場。</p>

      <h2>Projects</h2>
      <ul>
        <li>
          <a class="card" href="/medley-generator/">
            <span class="name">メドレーセトリ生成</span>
            <p class="desc">
              配信で演奏するメドレーの曲目を自動で組み、YouTube で連続再生できるツール。
            </p>
          </a>
        </li>
      </ul>

      <footer>
        <a href="https://naturalclar.dev/">naturalclar.dev</a> ·
        <a href="https://github.com/Naturalclar">GitHub</a>
      </footer>
    </main>
  </body>
</html>
